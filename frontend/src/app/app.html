<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header" [class.authenticated]="!!session.user()">
  <a class="brand" routerLink="/" aria-label="Matcha home"><span class="brand-mark" aria-hidden="true">✳</span>matcha<span class="brand-period">.</span></a>
  <nav aria-label="Main navigation">
    @if (session.user()) {
      <a routerLink="/discover">Discover</a>
      <a routerLink="/search">Search</a>
      <a routerLink="/activity">Activity</a>
      <a routerLink="/messages">Messages @if (live.unreadMessages()) { <span class="unread-badge" data-testid="messages-unread" [attr.aria-label]="live.unreadMessages() + ' unread messages'">{{ live.unreadMessages() }}</span> }</a>
      <a routerLink="/profile">My profile</a><button class="button small secondary" (click)="logout()">Sign out</button>
    } @else {
      <a routerLink="/login">Sign in</a><a class="button small" routerLink="/register">Join Matcha</a>
    }
  </nav>
</header>
<main id="main">@if (error()) { <p class="error page-width" role="alert">{{ error() }}</p> }<router-outlet /></main>
<footer class="site-footer"><a class="brand" routerLink="/">matcha.</a><span>Made for a real connection.</span><span>Take your time. Find your people.</span></footer>
