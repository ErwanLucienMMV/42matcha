name: matcha
services:
  database:
    image: postgres:18.7-bookworm@sha256:194e55feb2597b1465dbee81cc9fd8d204566cd2eb42c8d22fd6c931a38781b1
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-matcha}
      POSTGRES_USER: ${DATABASE_USER:-matcha}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/setup.ps1 or create .env first}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mail:
    image: axllent/mailpit@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports:
      - "127.0.0.1:${MAIL_PORT:-8025}:8025"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/${DATABASE_NAME:-matcha}
      DATABASE_USER: ${DATABASE_USER:-matcha}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: mail
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-Matcha <hello@matcha.local>}
    depends_on:
      database:
        condition: service_healthy
      mail:
        condition: service_started
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/api/ready]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/api/health]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
